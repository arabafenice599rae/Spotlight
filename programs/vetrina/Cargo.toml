[package]
name = "vetrina"
version = "0.1.0"
description = "Spotlight vetrina: all-pay auction with linear decay and consumable score"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "vetrina"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Anchor's derive/attribute macros emit cfgs (target_os = "solana", internal
# feature flags) that are unknown to a host `cargo check`. Declare them as
# expected so the lint stays useful for genuinely-unexpected cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
proptest = "1"
